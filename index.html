<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Resmi RW 013 Menteng Atas</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 font-sans text-slate-800">
  <!-- Slot spanduk (di atas header) -->
  <div id="banner-slot"></div>

  <header id="header" class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur"></header>

  <main>
    <div id="hero"></div>
    <div id="profil"></div>
    <div id="struktur"></div>
    <div id="agenda"></div>
    <div id="fasilitas"></div>
    <div id="peta-cuaca"></div>
  </main>

  <footer id="kontak"></footer>

  <!-- Config Firebase (isi dari Firebase Console) -->
  <script src="js/firebase-config.js"></script>

  <!-- Urutan: utils → render → peta-cuaca → app (module, terakhir) -->
  <script src="js/utils.js"></script>
  <script src="js/render.js"></script>
  <script src="js/peta-cuaca.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
